name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm zip:extension
      - name: Create the GitHub release with the extension package
        env:
          GH_TOKEN: ${{ github.token }}
        # Uses docs/releases/<tag>.md for the notes when it exists, otherwise GitHub's list of changes.
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" apps/extension/.output/*.zip \
            --title "Oppenly ${GITHUB_REF_NAME#v}" --verify-tag "$@"
