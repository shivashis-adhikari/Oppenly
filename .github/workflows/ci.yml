name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter @oppenly/extension exec playwright install --with-deps chromium
      - name: Extension end-to-end tests
        run: pnpm --filter @oppenly/extension test:e2e
      - name: Web app end-to-end tests
        run: pnpm --filter @oppenly/web test:e2e
      - name: Package the extension
        run: pnpm zip:extension
      - uses: actions/upload-artifact@v4
        with:
          name: oppenly-extension
          path: apps/extension/.output/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/*/test-results
          if-no-files-found: ignore
