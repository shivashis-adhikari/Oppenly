<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>New message</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #eef0f3; color: #1f2430; }
  .window { width: 620px; margin: 32px auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgb(0 0 0 / 6%), 0 12px 32px rgb(0 0 0 / 8%); overflow: hidden; }
  .bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: #f6f7f9; border-bottom: 1px solid #e6e8ec; font-weight: 600; font-size: 14px; }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #d4d8de; display: block; }
  .row { display: flex; gap: 10px; padding: 10px 18px; border-bottom: 1px solid #eef0f3; font-size: 14px; }
  .row span { color: #7a8190; width: 56px; }
  textarea { display: block; width: 100%; height: 330px; border: 0; outline: none; resize: none; padding: 16px 18px; font: inherit; color: inherit; }
  .foot { display: flex; gap: 10px; padding: 12px 18px; border-top: 1px solid #eef0f3; }
  .send { background: #2b3341; color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; font: 600 14px/1 inherit; }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><span>New message</span><span class="dots"><i></i><i></i><i></i></span></div>
  <div class="row"><span>To</span>jordan@example.com</div>
  <div class="row"><span>Subject</span>Draft review</div>
  <textarea id="body" aria-label="Message">Hi Jordan,

Thanks for sending the draft. Me and Priya reviewed it yesterday and the results is really good. We should utilize the new data in order to make a decision by Friday.

Sorry for the late reply, I will send you my notes tommorow.

Best,
Sam</textarea>
  <div class="foot"><button class="send" type="button">Send</button></div>
</div>
</body>
</html>
