<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Compose</title>
<style>
  body { font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f3f4f6; color: #1f2937; }
  main { max-width: 720px; margin: 48px auto; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 28px 32px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  label { display:block; font-size: 13px; color:#6b7280; margin: 14px 0 6px; }
  textarea { width: 100%; min-height: 140px; font: inherit; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; resize: vertical; box-sizing: border-box; }
  .editor { min-height: 140px; padding: 12px 14px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; }
  input { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
</style>
</head>
<body>
<main>
  <h1>New message</h1>
  <label for="subject">Subject</label>
  <input id="subject" type="text" value="Their going to review the proposal tommorow" />
  <label for="body">Plain text</label>
  <textarea id="body">Hi Sam,

Me and him goes to the office every day. The results is significant, and I seen the report yesterday. We should utilize the new tool in order to make a decision.

Sorry for the late reply, it was a very busy week.</textarea>
  <label id="rich-label" for="rich">Rich text</label>
  <div id="rich" class="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="rich-label"><p>Less people came then we expected, but the event was a success.</p><p>The report was written by the team and <b>it was reviewed</b> by the manager.</p></div>
</main>
</body>
</html>
